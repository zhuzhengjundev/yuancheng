<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>远程控制</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #6b7be8 0%, #5464d4 260px, #f4f6fc 260px, #f4f6fc 100%);
      display: flex;
      flex-direction: column;
      color: #333;
    }

    /* ========== 顶部标题区 ========== */
    .header {
      position: relative;
      padding: 36px 24px 28px;
      text-align: center;
      color: #fff;
    }
    .header .icon {
      width: 68px; height: 68px;
      margin: 0 auto 14px;
      background: rgba(255,255,255,0.18);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(6px);
    }
    .header .icon svg { width: 36px; height: 36px; color: #fff; }
    .header h1 { font-size: 24px; font-weight: 700; letter-spacing: 1px; }

    /* ========== 服务器连接状态 ========== */
    .server-status {
      display: inline-flex; align-items: center;
      margin-top: 10px;
      padding: 4px 12px;
      background: rgba(255,255,255,0.18);
      border-radius: 999px;
      font-size: 12px;
      color: #fff;
    }
    .server-status .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #ef4444;
      margin-right: 6px;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.1);
    }
    .server-status.online .dot { background: #22c55e; }

    /* ========== 设置按钮 ========== */
    .settings-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 36px; height: 36px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      backdrop-filter: blur(6px);
    }
    .settings-btn:hover { background: rgba(255,255,255,0.3); }

    /* ========== 卡片 ========== */
    .header { flex-shrink: 0; }
    .wrap {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 16px 24px;
      max-width: 460px;
      margin: 0 auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .wrap::-webkit-scrollbar { display: none; width: 0; height: 0; }
    .card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(56, 78, 183, 0.10);
      padding: 20px 18px 20px;
      margin-bottom: 16px;
    }
    .card h2 {
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
      display: flex; align-items: center;
      margin-bottom: 16px;
    }
    .card h2 svg { width: 18px; height: 18px; margin-right: 8px; color: #5b6be0; }

    /* ========== 本机信息 ========== */
    .code-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .code-box {
      background: #f5f7ff;
      border-radius: 12px;
      padding: 14px 12px 10px;
      text-align: center;
    }
    .code-box .label {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 8px;
    }
    .code-box .value {
      font-family: 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #111827;
      user-select: all;
      min-height: 28px;
    }
    .code-box.pwd .value { color: #dc2626; }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      margin-top: 14px;
    }
    .btn {
      border: none;
      cursor: pointer;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .btn-ghost {
      background: #eef1ff;
      color: #4f46e5;
    }
    .btn-ghost:hover { background: #e1e6ff; }
    .btn-warn {
      background: #fff7ed;
      color: #c2410c;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .btn-warn:hover { background: #ffedd5; }
    .btn-warn svg { width: 14px; height: 14px; }

    .btn-primary {
      background: linear-gradient(135deg, #6b7be8 0%, #5464d4 100%);
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      width: 100%;
      box-shadow: 0 6px 18px rgba(84, 100, 212, 0.32);
    }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-primary:disabled { filter: grayscale(0.3); opacity: 0.65; cursor: not-allowed; box-shadow: none; }

    .btn-danger {
      background: #fef2f2;
      color: #dc2626;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      width: 100%;
      margin-top: 12px;
    }
    .btn-danger:hover { background: #fee2e2; }

    /* ========== 连接远程设备 ========== */
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 13px;
      color: #374151;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      color: #111827;
      background: #fff;
      transition: all 0.15s;
      outline: none;
    }
    .input:focus {
      border-color: #6b7be8;
      box-shadow: 0 0 0 4px rgba(107, 123, 232, 0.15);
    }
    .input::placeholder { color: #9ca3af; }

    .tip {
      margin-top: 12px;
      padding: 10px 12px;
      background: #f0f9ff;
      color: #075985;
      font-size: 12px;
      border-radius: 10px;
      line-height: 1.6;
    }

    .error-tip {
      margin-top: 12px;
      padding: 10px 12px;
      background: #fef2f2;
      color: #b91c1c;
      font-size: 13px;
      border-radius: 10px;
      display: none;
    }
    .error-tip.show { display: block; }

    /* ========== 会话状态提示 ========== */
    .session-tip {
      margin-top: 10px;
      padding: 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.6;
      display: none;
    }
    .session-tip.show { display: block; }
    .session-tip.controlling {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .session-tip.controlled {
      background: #fff7ed;
      color: #9a3412;
      border: 1px solid #fed7aa;
    }

    /* ========== toast ========== */
    .toast {
      position: fixed;
      left: 50%;
      top: 32px;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(17, 24, 39, 0.92);
      color: #fff;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ========== 屏幕录制权限警告 ========== */
    .capture-warn {
      margin-top: 10px;
      padding: 14px;
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
      border: 1px solid #f59e0b;
      border-radius: 12px;
      font-size: 13px;
      color: #92400e;
      line-height: 1.6;
      display: none;
    }
    .capture-warn.show { display: block; }
    .capture-warn .warn-title {
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .capture-warn .warn-title svg { width: 16px; height: 16px; }
    .capture-warn .warn-msg { margin-bottom: 10px; }
    .capture-warn .warn-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: #f59e0b;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .capture-warn .warn-btn:hover { background: #d97706; }
    .capture-warn .warn-btn svg { width: 14px; height: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <button class="settings-btn" id="btnSettings" title="修改服务器地址">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="13" rx="2"/>
        <line x1="12" y1="16" x2="12" y2="19"/>
        <line x1="8" y1="19" x2="16" y2="19"/>
        <path d="M5 4l6 6-2 1-1 2-1-1-2 2z" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <h1>远程控制</h1>
    <div class="server-status offline" id="serverStatus">
      <span class="dot"></span><span id="serverStatusText">正在连接服务器...</span>
    </div>
  </div>

  <div class="wrap">
    <!-- 本机信息 -->
    <div class="card">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        本机信息
      </h2>

      <div class="code-row">
        <div class="code-box">
          <div class="label">设备代码</div>
          <div class="value" id="deviceCode">--- --- ---</div>
        </div>
        <div class="code-box pwd">
          <div class="label">密码</div>
          <div class="value" id="password">------</div>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-ghost" id="btnCopyCode">复制设备代码</button>
        <button class="btn btn-ghost" id="btnCopyAll">复制全部</button>
        <button class="btn btn-warn" id="btnRefresh" title="刷新密码">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
          刷新
        </button>
      </div>

      <div class="session-tip controlling" id="sessControlling">
        ✅ 您正在控制对方设备（<span id="peerCodeA"></span>）<br>远程桌面窗口已打开，可直接进行操作。
      </div>
      <div class="session-tip controlled" id="sessControlled">
        ⚠️ 对方设备（<span id="peerCodeB"></span>）正在控制本机<br>您可以随时点击下方"断开连接"终止会话。
      </div>

      <!-- 屏幕录制权限警告 -->
      <div class="capture-warn" id="captureWarn">
        <div class="warn-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          屏幕录制权限未开启
        </div>
        <div class="warn-msg" id="captureWarnMsg">无法捕获屏幕画面，远程控制对方将无法看到您的屏幕。请在系统设置中授予屏幕录制权限。</div>
        <button class="warn-btn" id="btnFixCapture">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          打开系统设置
        </button>
      </div>

      <button class="btn btn-danger" id="btnDisconnect" style="display:none;">断开连接</button>
    </div>

    <!-- 连接远程设备 -->
    <div class="card">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 3h5v5"/>
          <path d="M8 21H3v-5"/>
          <path d="M21 3l-7 7"/>
          <path d="M3 21l7-7"/>
        </svg>
        连接远程设备
      </h2>

      <div class="field">
        <label>对方设备代码</label>
        <input class="input" id="inputCode" type="text" inputmode="numeric" maxlength="11" placeholder="请输入9位设备代码" autocomplete="off">
      </div>
      <div class="field">
        <label>对方密码</label>
        <input class="input" id="inputPwd" type="text" inputmode="numeric" maxlength="6" placeholder="请输入6位密码" autocomplete="off">
      </div>

      <button class="btn btn-primary" id="btnConnect">连接远程设备</button>

      <div class="error-tip" id="errTip"></div>
      <div class="tip">
        💡 将本机的"设备代码 + 密码"告知对方，或向对方索取其设备代码与密码，即可发起远程控制。
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const api = window.remoteAPI;
    const $ = (id) => document.getElementById(id);

    // ============ 工具 ============
    function fmtCode(c) {
      if (!c) return '--- --- ---';
      const s = c.replace(/\s/g, '');
      if (s.length !== 9) return s;
      return s.slice(0, 3) + ' ' + s.slice(3, 6) + ' ' + s.slice(6);
    }
    function cleanCode(s) { return (s || '').toString().replace(/\D/g, '').slice(0, 9); }

    let toastTimer = null;
    function toast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
    }
    async function copyText(txt) {
      try {
        await navigator.clipboard.writeText(txt);
        return true;
      } catch (e) {
        try {
          const ta = document.createElement('textarea');
          ta.value = txt; document.body.appendChild(ta);
          ta.select(); document.execCommand('copy');
          document.body.removeChild(ta);
          return true;
        } catch (e2) { return false; }
      }
    }

    // ============ 渲染 ============
    function renderDevice(code, pwd) {
      $('deviceCode').textContent = fmtCode(code);
      $('password').textContent = pwd ? pwd : '------';
    }

    function renderServerStatus(connected) {
      const el = $('serverStatus');
      const txt = $('serverStatusText');
      if (connected) {
        el.classList.add('online'); el.classList.remove('offline');
        txt.textContent = '已连接服务器';
      } else {
        el.classList.remove('online'); el.classList.add('offline');
        txt.textContent = '正在连接服务器...';
      }
    }

    function renderSession(session) {
      const controlling = $('sessControlling');
      const controlled = $('sessControlled');
      const btnDisconnect = $('btnDisconnect');
      const connectArea = $('btnConnect');
      const inputs = [ $('inputCode'), $('inputPwd') ];

      if (!session) {
        controlling.classList.remove('show');
        controlled.classList.remove('show');
        btnDisconnect.style.display = 'none';
        connectArea.disabled = false;
        inputs.forEach(i => i.disabled = false);
        return;
      }
      btnDisconnect.style.display = 'block';
      connectArea.disabled = true;
      inputs.forEach(i => i.disabled = true);

      const prettyPeer = fmtCode(session.peerCode);
      if (session.role === 'controller') {
        controlling.classList.add('show');
        controlled.classList.remove('show');
        $('peerCodeA').textContent = prettyPeer;
      } else {
        controlling.classList.remove('show');
        controlled.classList.add('show');
        $('peerCodeB').textContent = prettyPeer;
      }
    }

    function showError(msg) {
      const el = $('errTip');
      el.textContent = '❌ ' + msg;
      el.classList.add('show');
      clearTimeout(showError._t);
      showError._t = setTimeout(() => el.classList.remove('show'), 4000);
    }
    function clearError() { $('errTip').classList.remove('show'); }

    // ============ 事件 ============
    // 修改服务器地址
    $('btnSettings').onclick = () => {
      if (api.gotoSetup) api.gotoSetup();
    };

    $('btnCopyCode').onclick = async () => {
      const info = await api.getDeviceInfo();
      if (info && info.deviceCode) {
        const c = cleanCode(info.deviceCode);
        if (await copyText(c)) toast('设备代码已复制');
      } else {
        toast('尚未获取到设备代码');
      }
    };
    $('btnCopyAll').onclick = async () => {
      const info = await api.getDeviceInfo();
      if (info && info.deviceCode && info.password) {
        const c = cleanCode(info.deviceCode);
        const text = `设备代码：${fmtCode(c)}\n密码：${info.password}`;
        if (await copyText(text)) toast('已复制设备代码+密码');
      } else {
        toast('尚未获取到本机信息');
      }
    };
    $('btnRefresh').onclick = async () => {
      await api.refreshPassword();
      toast('正在刷新密码...');
    };

    // 输入自动格式化
    $('inputCode').addEventListener('input', (e) => {
      const cleaned = cleanCode(e.target.value);
      e.target.value = fmtCode(cleaned).replace(/---/g, '').trim();
      clearError();
    });
    $('inputPwd').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
      clearError();
    });

    $('btnConnect').onclick = async () => {
      clearError();
      const rawCode = $('inputCode').value;
      const pwd = $('inputPwd').value;
      const code = cleanCode(rawCode);
      if (code.length !== 9) { showError('请输入9位设备代码'); return; }
      if (pwd.length !== 6) { showError('请输入6位密码'); return; }

      const info = await api.getDeviceInfo();
      if (!info || !info.serverConnected) { showError('尚未连接到服务器，请稍候重试'); return; }
      if (info.session) { showError('当前已有会话，请先断开'); return; }

      $('btnConnect').disabled = true;
      $('btnConnect').textContent = '连接中...';
      const ok = await api.connectDevice(code, pwd);
      if (!ok) {
        $('btnConnect').disabled = false;
        $('btnConnect').textContent = '连接远程设备';
        showError('发送失败，请检查网络');
      }
      // 成功/失败 会通过事件回调 updateSession / showError 处理
    };

    $('btnDisconnect').onclick = async () => {
      await api.disconnect();
      toast('已断开连接');
      renderSession(null);
    };

    // ============ 事件订阅 ============
    api.onAppStatus((s) => {
      renderServerStatus(!!s.serverConnected);
      renderDevice(s.deviceCode, s.password);
      renderSession(s.session);
    });
    api.onDeviceInfo((d) => {
      renderDevice(d.deviceCode, d.password);
      toast(d.password ? '密码已刷新' : '本机信息已更新');
    });
    api.onConnectError((msg) => {
      $('btnConnect').disabled = false;
      $('btnConnect').textContent = '连接远程设备';
      showError(msg);
    });
    api.onConnectOk((r) => {
      $('btnConnect').disabled = true;
      $('btnConnect').textContent = '已连接';
      toast(`已连接到 ${fmtCode(r.peerCode)}`);
    });
    api.onIncomingControl((r) => {
      toast(`设备 ${fmtCode(r.peerCode)} 正在控制本机`);
    });
    api.onCaptureStatus((s) => {
      const warn = $('captureWarn');
      const msg = $('captureWarnMsg');
      if (!s.ok) {
        msg.textContent = s.message || '屏幕捕获失败，请检查屏幕录制权限';
        warn.classList.add('show');
      } else {
        warn.classList.remove('show');
      }
    });
    $('btnFixCapture').onclick = () => {
      if (api.openScreenRecordSettings) {
        api.openScreenRecordSettings();
        toast('已打开系统设置，请开启屏幕录制权限');
      }
    };
    api.onSessionEnded(() => {
      renderSession(null);
      $('btnConnect').disabled = false;
      $('btnConnect').textContent = '连接远程设备';
      toast('会话已结束');
    });

    // ============ 初始化 ============
    (async function init() {
      const s = await api.getDeviceInfo();
      renderServerStatus(!!s.serverConnected);
      renderDevice(s.deviceCode, s.password);
      renderSession(s.session);
    })();
  </script>
</body>
</html>

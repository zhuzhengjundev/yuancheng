<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>远程控制</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app {
      text-align: center;
      width: 100%;
      max-width: 380px;
      padding: 20px;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
    }
    .logo svg { width: 40px; height: 40px; }

    .title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    /* 连接状态 */
    .status-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 28px 20px;
      margin-bottom: 16px;
    }
    .status-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .status-icon.connecting svg {
      animation: spin 2s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .status-icon.connected svg {
      color: #4caf50;
    }
    .status-icon.connecting svg {
      color: #667eea;
    }
    .status-text {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .status-desc {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      line-height: 1.5;
    }

    .peer-info {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.06);
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      display: none;
    }
    .peer-info.show { display: block; }
    .peer-info .ip {
      color: #667eea;
      font-family: 'Courier New', monospace;
      font-weight: 600;
    }

    .btn-disconnect {
      width: 100%;
      padding: 14px;
      background: rgba(244, 67, 54, 0.15);
      border: 1px solid rgba(244, 67, 54, 0.3);
      border-radius: 12px;
      color: #ff5252;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: none;
    }
    .btn-disconnect.show { display: block; }
    .btn-disconnect:hover { background: rgba(244, 67, 54, 0.25); }

    .footer {
      margin-top: 20px;
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      line-height: 1.6;
    }
    .footer code {
      color: rgba(255,255,255,0.5);
      font-family: 'Courier New', monospace;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <path d="M8 21h8M12 17v4"/>
      </svg>
    </div>
    <div class="title">远程控制</div>

    <div class="status-card">
      <div class="status-icon connecting" id="statusIcon">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>
      </div>
      <div class="status-text" id="statusText">正在连接对方...</div>
      <div class="status-desc" id="statusDesc">程序正在尝试连接对方公网IP</div>

      <div class="peer-info" id="peerInfo">
        已连接: <span class="ip" id="peerIp">--</span>
      </div>
    </div>

    <button class="btn-disconnect" id="btnDisconnect">断开连接</button>

    <div class="footer">
      对端IP: <code>27.115.22.146</code> / <code>58.210.4.122</code><br>
      连接建立后自动打开远程桌面
    </div>
  </div>

  <script>
    const api = window.remoteAPI;
    const $ = id => document.getElementById(id);

    async function init() {
      const status = await api.getP2pStatus();
      updateStatus(status.connected);

      api.onP2pStatus(updateStatus);
      api.onSessionEnded(() => updateStatus(false));
    }

    function updateStatus(connected) {
      const icon = $('statusIcon');
      const text = $('statusText');
      const desc = $('statusDesc');
      const peerInfo = $('peerInfo');
      const btn = $('btnDisconnect');

      if (connected) {
        icon.className = 'status-icon connected';
        icon.innerHTML = `
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>`;
        text.textContent = '已连接对方';
        desc.textContent = '远程桌面窗口已自动打开，可直接控制对方';
        peerInfo.classList.add('show');
        btn.classList.add('show');
      } else {
        icon.className = 'status-icon connecting';
        icon.innerHTML = `
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
          </svg>`;
        text.textContent = '正在连接对方...';
        desc.textContent = '请确保两台设备都已启动程序';
        peerInfo.classList.remove('show');
        btn.classList.remove('show');
      }
    }

    $('btnDisconnect').onclick = async () => {
      await api.disconnect();
      updateStatus(false);
    };

    init();
  </script>
</body>
</html>

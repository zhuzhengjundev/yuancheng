<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>远程控制</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #1a1a2e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* 顶部工具栏 */
    .toolbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 50px;
      background: rgba(26, 26, 46, 0.95);
      backdrop-filter: blur(10px);
      display: flex; align-items: center;
      padding: 0 16px; gap: 16px; z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .toolbar .status-info {
      display: flex; align-items: center; gap: 10px; flex: 1;
    }
    .rec-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #e91e63;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(233,30,99,0.4); }
      50% { opacity: 0.8; box-shadow: 0 0 0 8px rgba(233,30,99,0); }
    }
    .status-text { color: #fff; font-size: 14px; }
    .fps { color: #888; font-size: 12px; font-family: 'Courier New', monospace; }

    .toolbar-buttons { display: flex; gap: 8px; align-items: center; }
    .t-btn {
      padding: 8px 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #e0e0e0; font-size: 13px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.15s;
    }
    .t-btn:hover { background: rgba(102,126,234,0.2); border-color: rgba(102,126,234,0.4); }
    .t-btn.active { background: rgba(102,126,234,0.3); border-color: #667eea; color: #fff; }
    .t-btn.danger:hover { background: rgba(244,67,54,0.2); border-color: rgba(244,67,54,0.4); color: #ff8a80; }
    .t-btn svg { width: 16px; height: 16px; }
    .divider { width: 1px; height: 24px; background: rgba(255,255,255,0.1); }

    /* 屏幕显示区 */
    .screen-container {
      position: absolute; top: 50px; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 16px; overflow: auto;
    }
    #screen {
      max-width: 100%; max-height: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      border-radius: 4px; background: #000;
      cursor: crosshair;
    }
    .placeholder { color: #666; font-size: 15px; text-align: center; }
    .placeholder svg { width: 80px; height: 80px; margin-bottom: 16px; opacity: 0.5; }
    .hidden { display: none !important; }
    
    /* 调试信息 */
    .debug-info { margin-top: 20px; font-size: 13px; color: #888; line-height: 1.6; }
    .debug-sub { font-size: 11px; color: #555; margin-top: 8px; }
    .debug-panel {
      position: fixed; bottom: 10px; left: 10px;
      background: rgba(0,0,0,0.75); color: #0f0; font-family: Consolas, Monaco, monospace;
      font-size: 11px; padding: 8px 12px; border-radius: 6px;
      border: 1px solid rgba(0,255,0,0.3); z-index: 50;
      min-width: 180px; display: none;
    }
    .debug-panel.show { display: block; }
    .debug-row { display: flex; justify-content: space-between; gap: 12px; margin: 2px 0; }
    .debug-row span:first-child { color: #888; }
    .debug-row span:last-child { color: #0f0; }

    /* 剪贴板弹窗 */
    .clipboard-modal {
      position: fixed; top: 70px; right: 16px;
      background: #2d2d44; padding: 16px;
      border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      width: 360px; z-index: 200; display: none;
    }
    .clipboard-modal.show { display: block; }
    .clip-title {
      font-size: 13px; color: #a0a0c0; margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .clip-close { cursor: pointer; color: #888; font-size: 18px; line-height: 1; }
    #clipTextarea {
      width: 100%; height: 120px;
      background: #1a1a2e; color: #e0e0e0;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; padding: 10px; font-size: 13px;
      resize: none; outline: none;
      font-family: Consolas, Monaco, monospace;
    }
    #clipTextarea:focus { border-color: #667eea; }
    .clip-actions { display: flex; gap: 8px; margin-top: 10px; }
    .clip-btn { flex: 1; padding: 8px; border-radius: 8px; font-size: 13px; cursor: pointer; border: none; }
    .clip-btn.send { background: #667eea; color: #fff; }
    .clip-btn.send:hover { background: #5a6fd8; }
    .clip-btn.cancel { background: rgba(255,255,255,0.06); color: #ccc; }

    /* 断开覆盖层 */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center;
      z-index: 500;
    }
    .overlay.show { display: flex; }
    .overlay-box {
      background: #2d2d44; padding: 32px 40px;
      border-radius: 16px; text-align: center; max-width: 400px;
    }
    .overlay-title { color: #fff; font-size: 18px; margin-bottom: 10px; }
    .overlay-desc { color: #a0a0c0; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
    .overlay-btn {
      padding: 10px 28px; background: #667eea; color: #fff;
      border: none; border-radius: 8px; font-size: 14px; cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- 顶部工具栏 -->
  <div class="toolbar">
    <div class="status-info">
      <span class="rec-dot"></span>
      <div class="status-text">远程桌面 - 对方屏幕</div>
      <span class="fps" id="fpsDisplay">等待画面...</span>
      <span class="fps" id="frameInfo" style="display:none;"></span>
    </div>
    <div class="toolbar-buttons">
      <button class="t-btn" id="btnFullscreen" title="全屏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>
        </svg>
        全屏
      </button>
      <button class="t-btn" id="btnClipboard" title="剪贴板同步">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        剪贴板
      </button>
      <button class="t-btn" id="btnSendKeys" title="发送组合键">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="5" width="20" height="14" rx="2"/>
          <path d="M6 9l4 4M10 9l-4 4M14 13h4M14 9h2a2 2 0 0 1 2 2"/>
        </svg>
        组合键
      </button>
      <div class="divider"></div>
      <button class="t-btn danger" id="btnDisconnect" title="断开">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 2.6 3.4z"/>
          <line x1="23" y1="1" x2="1" y2="23"/>
        </svg>
        断开
      </button>
    </div>
  </div>

  <!-- 屏幕显示 -->
  <div class="screen-container">
    <div class="placeholder" id="placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
      <div>正在等待远程画面...</div>
      <div class="debug-info" id="debugInfo">
        <div>📡 等待屏幕帧中...</div>
        <div class="debug-sub">如果长时间无画面，请打开开发者工具查看日志</div>
      </div>
    </div>
    <img id="screen" class="hidden" alt="远程屏幕">
    <!-- 调试面板 -->
    <div class="debug-panel" id="debugPanel">
      <div class="debug-row"><span>状态:</span> <span id="dbgStatus">等待中</span></div>
      <div class="debug-row"><span>主进程帧:</span> <span id="dbgProcFrames">0</span></div>
      <div class="debug-row"><span>主进程块:</span> <span id="dbgProcChunks">0</span></div>
      <div class="debug-row"><span>空帧丢弃:</span> <span id="dbgEmpty">0</span></div>
      <div class="debug-row"><span>帧头:</span> <span id="dbgHeader">0</span></div>
      <div class="debug-row"><span>数据块:</span> <span id="dbgChunks">0/0</span></div>
      <div class="debug-row"><span>已组装:</span> <span id="dbgAssembled">0</span></div>
      <div class="debug-row"><span>旧格式帧:</span> <span id="dbgOldFormat">0</span></div>
      <div class="debug-row"><span>分辨率:</span> <span id="dbgResolution">-</span></div>
    </div>
  </div>

  <!-- 剪贴板弹窗 -->
  <div class="clipboard-modal" id="clipboardModal">
    <div class="clip-title">
      <span>剪贴板同步</span>
      <span class="clip-close" id="clipClose">×</span>
    </div>
    <textarea id="clipTextarea" placeholder="输入内容将同步到对方剪贴板"></textarea>
    <div class="clip-actions">
      <button class="clip-btn cancel" id="clipCancel">取消</button>
      <button class="clip-btn send" id="clipSend">发送到对方</button>
    </div>
  </div>

  <!-- 断开覆盖层 -->
  <div class="overlay" id="overlayEnd">
    <div class="overlay-box">
      <div class="overlay-title">连接已断开</div>
      <div class="overlay-desc">对方已断开连接，正在尝试重新连接...</div>
      <button class="overlay-btn" id="btnCloseWindow">关闭</button>
    </div>
  </div>

  <script>
    const api = window.remoteAPI;
    const $ = id => document.getElementById(id);

    console.log('[Control] ========== 初始化控制窗口 ==========');
    console.log('[Control] remoteAPI 可用:', !!api);
    console.log('[Control] onScreenFrameHeader 可用:', !!api.onScreenFrameHeader);
    console.log('[Control] onScreenFrameChunk 可用:', !!api.onScreenFrameChunk);
    console.log('[Control] onScreenFrame (旧格式) 可用:', !!api.onScreenFrame);

    // ====== 调试面板 ======
    const dbg = {
      headerCount: 0,
      chunkReceived: 0,
      chunkTotal: 0,
      assembledCount: 0,
      oldFormatCount: 0,
      lastResolution: '-',
      lastUpdate: 0
    };
    
    function updateDebugPanel(force) {
      const now = Date.now();
      if (!force && now - dbg.lastUpdate < 200) return; // 限频200ms
      dbg.lastUpdate = now;
      
      const panel = $('debugPanel');
      if (!panel) return;
      panel.classList.add('show');
      
      $('dbgStatus').textContent = totalFrames > 0 ? '✅ 传输中' : '⏳ 等待中';
      $('dbgHeader').textContent = dbg.headerCount;
      $('dbgChunks').textContent = `${dbg.chunkReceived}/${dbg.chunkTotal}`;
      $('dbgAssembled').textContent = dbg.assembledCount;
      $('dbgOldFormat').textContent = dbg.oldFormatCount;
      $('dbgResolution').textContent = dbg.lastResolution;
      $('dbgProcFrames').textContent = `${diagProc.frames} (${diagProc.sizeKB}KB)`;
      $('dbgProcChunks').textContent = diagProc.chunks;
      $('dbgEmpty').textContent = diagProc.empty;
    }

    // 主进程诊断数据（来自 main.js 的 diag-stats）
    const diagProc = { frames: 0, chunks: 0, sizeKB: '0.0', empty: 0 };
    if (api.onDiagStats) {
      api.onDiagStats((d) => {
        if (!d) return;
        diagProc.frames = d.framesReceived || 0;
        diagProc.chunks = d.chunksSent || 0;
        diagProc.sizeKB = d.framesSizeKB || '0.0';
        diagProc.empty = d.emptyFrames || 0;
        updateDebugPanel(true);
      });
    }
    
    // 每秒强制更新一次
    setInterval(() => updateDebugPanel(true), 1000);

    // ====== FPS 计算 ======
    let frameCount = 0;
    let lastFpsTime = performance.now();
    let totalFrames = 0;
    let lastFrameReceiveTime = 0;
    let lastFrameTime = 0;
    
    setInterval(() => {
      const now = performance.now();
      const elapsed = (now - lastFpsTime) / 1000;
      const fps = Math.round(frameCount / elapsed);
      $('fpsDisplay').textContent = fps + ' FPS';
      frameCount = 0;
      lastFpsTime = now;
    }, 1000);

    // ====== 分块接收与重组 ======
    // 当前正在接收的帧数据
    let currentFrame = null; // { frameId, width, height, totalChunks, chunks: [], received: Set }
    
    // 实际屏幕分辨率（用于鼠标坐标映射）
    let realScreenWidth = 1920;
    let realScreenHeight = 1080;
    
    function renderAssembledFrame() {
      if (!currentFrame) return;
      
      const { width, height, chunks, totalChunks } = currentFrame;
      
      // 检查是否收齐所有块
      const receivedCount = Object.keys(chunks).length;
      if (receivedCount < totalChunks) return;
      
      // 按顺序组装所有块
      let imageData = '';
      for (let i = 0; i < totalChunks; i++) {
        if (chunks[i] === undefined) {
          console.warn('[Control] 缺失块:', i, '共', totalChunks, '块');
          return;
        }
        imageData += chunks[i];
      }
      
      // 清理当前帧（立即释放内存）
      const frameId = currentFrame.frameId;
      currentFrame = null;
      
      // 更新调试
      dbg.assembledCount++;
      updateDebugPanel();
      
      // 渲染图像
      totalFrames++;
      frameCount++;
      lastFrameReceiveTime = performance.now();
      const now = performance.now();
      
      // 第一帧
      if (totalFrames === 1) {
        console.log('[Control] ========== 画面传输开始 ==========');
        console.log('[Control] 分辨率:', width, 'x', height, '帧大小:', (imageData.length * 3 / 4 / 1024).toFixed(1), 'KB');
        $('fpsDisplay').textContent = '画面传输中';
      }
      
      // 定期显示详细信息
      if (now - lastFrameTime >= 5000) {
        const imgSize = (imageData.length * 3 / 4 / 1024).toFixed(1);
        console.log(`[Control] 统计: 总${totalFrames}帧, 当前帧: ${imgSize}KB, ${width}x${height}`);
        $('frameInfo').textContent = `${width}x${height} | ${imgSize}KB | 总${totalFrames}帧`;
        $('frameInfo').style.display = 'inline';
        lastFrameTime = now;
      }
      
      const screen = $('screen');
      try {
        if (imageData.length < 100) {
          console.warn('[Control] 组装后的帧数据过短');
          return;
        }
        
        const src = 'data:image/jpeg;base64,' + imageData;
        screen.src = src;
        
        if (screen.classList.contains('hidden')) {
          screen.classList.remove('hidden');
          $('placeholder').classList.add('hidden');
          console.log('[Control] 画面已显示');
        }
      } catch (err) {
        console.error('[Control] 渲染帧失败:', err.message);
      }
    }
    
    // 接收帧头
    api.onScreenFrameHeader((header) => {
      if (!header || !header.frameId) {
        console.warn('[Control] 收到无效的帧头');
        return;
      }
      
      dbg.headerCount++;
      dbg.chunkTotal = header.totalChunks;
      dbg.lastResolution = `${header.width}x${header.height}`;
      // 保存实际屏幕分辨率（用于坐标映射）
      if (header.screenWidth && header.screenHeight) {
        realScreenWidth = header.screenWidth;
        realScreenHeight = header.screenHeight;
      }
      updateDebugPanel();
      
      // 丢弃旧帧（如果接收时间过长）
      if (currentFrame && currentFrame.frameId !== header.frameId) {
        const age = Date.now() - (currentFrame.startTime || 0);
        if (age > 500) {
          console.log('[Control] 丢弃旧帧 (超时)');
          currentFrame = null;
        }
      }
      
      currentFrame = {
        frameId: header.frameId,
        width: header.width,
        height: header.height,
        totalChunks: header.totalChunks,
        chunks: new Array(header.totalChunks),
        startTime: Date.now()
      };
      
      // 如果只有1块，直接渲染
      if (header.totalChunks === 1) {
        // 等待块数据到达
      }
    });
    
    // 接收数据块
    api.onScreenFrameChunk((chunk) => {
      if (!chunk || !currentFrame) {
        if (!currentFrame) {
          console.warn('[Control] 收到数据块但当前没有帧头');
        }
        return;
      }
      
      if (chunk.frameId !== currentFrame.frameId) {
        // 丢弃过期的块
        return;
      }
      
      // 存储块
      currentFrame.chunks[chunk.chunkIndex] = chunk.data;
      
      // 更新调试
      const receivedCount = currentFrame.chunks.filter(c => c !== undefined).length;
      dbg.chunkReceived = receivedCount;
      updateDebugPanel();
      
      // 检查是否收齐
      if (receivedCount >= currentFrame.totalChunks) {
        renderAssembledFrame();
      }
    });
    
    // 兼容旧格式（完整帧一次性发送）
    api.onScreenFrame(({ image, width, height, screenWidth, screenHeight }) => {
      if (!image) return;
      
      dbg.oldFormatCount++;
      dbg.lastResolution = `${width}x${height}`;
      // 保存实际屏幕分辨率
      if (screenWidth && screenHeight) {
        realScreenWidth = screenWidth;
        realScreenHeight = screenHeight;
      }
      updateDebugPanel();
      
      totalFrames++;
      frameCount++;
      lastFrameReceiveTime = performance.now();
      const now = performance.now();
      
      if (totalFrames === 1) {
        console.log('[Control] ========== 收到第一帧 (旧格式) ==========');
        $('fpsDisplay').textContent = '画面传输中';
        $('debugInfo').style.display = 'none';
      }
      
      if (now - lastFrameTime >= 5000) {
        const imgSize = (image.length * 3 / 4 / 1024).toFixed(1);
        console.log(`[Control] 统计(旧格式): 总${totalFrames}帧, ${imgSize}KB, ${width}x${height}`);
        lastFrameTime = now;
      }
      
      const screen = $('screen');
      try {
        screen.src = 'data:image/jpeg;base64,' + image;
        if (screen.classList.contains('hidden')) {
          screen.classList.remove('hidden');
          $('placeholder').classList.add('hidden');
          console.log('[Control] 画面已显示 (旧格式)');
        }
      } catch (err) {
        console.error('[Control] 渲染帧失败:', err.message);
      }
    });
    
    console.log('[Control] 帧接收器已启动，等待画面...');
    
    // 超时清理：每 500ms 检查一次是否有过期的帧
    setInterval(() => {
      if (currentFrame) {
        const age = Date.now() - currentFrame.startTime;
        if (age > 500) {
          // 超过 500ms 还没收齐，丢弃
          const receivedCount = currentFrame.chunks.filter(c => c !== undefined).length;
          console.log(`[Control] 丢弃超时帧 ${currentFrame.frameId}: ${receivedCount}/${currentFrame.totalChunks} 块`);
          currentFrame = null;
        }
      }
    }, 100);

    // ====== 鼠标事件 ======
    function getRelativeCoords(e) {
      const img = $('screen');
      const rect = img.getBoundingClientRect();
      // 先算相对坐标（0-1）
      const relX = (e.clientX - rect.left) / rect.width;
      const relY = (e.clientY - rect.top) / rect.height;
      // 转换成实际屏幕坐标
      const x = Math.round(Math.min(realScreenWidth, Math.max(0, relX * realScreenWidth)));
      const y = Math.round(Math.min(realScreenHeight, Math.max(0, relY * realScreenHeight)));
      return { x, y };
    }

    function sendCmd(command, params) {
      api.sendCommand(command, params);
    }

    const img = $('screen');
    let lastMoveTime = 0;

    img.addEventListener('mousemove', (e) => {
      const now = Date.now();
      if (now - lastMoveTime < 20) return;
      lastMoveTime = now;
      const { x, y } = getRelativeCoords(e);
      sendCmd('mouse-move', { x, y });
    });

    img.addEventListener('mousedown', (e) => {
      e.preventDefault();
      const { x, y } = getRelativeCoords(e);
      const button = e.button === 2 ? 'right' : e.button === 1 ? 'middle' : 'left';
      sendCmd('mouse-down', { x, y, button });
    });

    img.addEventListener('mouseup', (e) => {
      e.preventDefault();
      const button = e.button === 2 ? 'right' : e.button === 1 ? 'middle' : 'left';
      sendCmd('mouse-up', { button });
    });

    img.addEventListener('dblclick', (e) => {
      e.preventDefault();
      const { x, y } = getRelativeCoords(e);
      const button = e.button === 2 ? 'right' : 'left';
      sendCmd('mouse-click', { x, y, button, double: true });
    });

    img.addEventListener('wheel', (e) => {
      e.preventDefault();
      const dy = -Math.sign(e.deltaY) * Math.min(5, Math.ceil(Math.abs(e.deltaY) / 40));
      const dx = -Math.sign(e.deltaX) * Math.min(5, Math.ceil(Math.abs(e.deltaX) / 40));
      sendCmd('mouse-scroll', { dx, dy });
    }, { passive: false });

    img.addEventListener('contextmenu', e => e.preventDefault());

    // ====== 键盘事件 ======
    const keyMap = {
      'Backspace': 'backspace', 'Tab': 'tab', 'Enter': 'enter',
      'ShiftLeft': 'shift', 'ShiftRight': 'shift',
      'ControlLeft': 'control', 'ControlRight': 'control',
      'AltLeft': 'alt', 'AltRight': 'alt',
      'MetaLeft': 'command', 'MetaRight': 'command',
      'Escape': 'escape', 'Space': 'space',
      'ArrowUp': 'up', 'ArrowDown': 'down', 'ArrowLeft': 'left', 'ArrowRight': 'right',
      'CapsLock': 'capslock', 'NumLock': 'numlock', 'ScrollLock': 'scrolllock',
      'Insert': 'insert', 'Delete': 'delete', 'Home': 'home', 'End': 'end',
      'PageUp': 'pageup', 'PageDown': 'pagedown',
      'F1': 'f1', 'F2': 'f2', 'F3': 'f3', 'F4': 'f4',
      'F5': 'f5', 'F6': 'f6', 'F7': 'f7', 'F8': 'f8',
      'F9': 'f9', 'F10': 'f10', 'F11': 'f11', 'F12': 'f12',
      'Digit0': '0', 'Digit1': '1', 'Digit2': '2', 'Digit3': '3', 'Digit4': '4',
      'Digit5': '5', 'Digit6': '6', 'Digit7': '7', 'Digit8': '8', 'Digit9': '9',
      'KeyA': 'a', 'KeyB': 'b', 'KeyC': 'c', 'KeyD': 'd', 'KeyE': 'e',
      'KeyF': 'f', 'KeyG': 'g', 'KeyH': 'h', 'KeyI': 'i', 'KeyJ': 'j',
      'KeyK': 'k', 'KeyL': 'l', 'KeyM': 'm', 'KeyN': 'n', 'KeyO': 'o',
      'KeyP': 'p', 'KeyQ': 'q', 'KeyR': 'r', 'KeyS': 's', 'KeyT': 't',
      'KeyU': 'u', 'KeyV': 'v', 'KeyW': 'w', 'KeyX': 'x', 'KeyY': 'y', 'KeyZ': 'z',
      'Semicolon': ';', 'Equal': '=', 'Comma': ',', 'Minus': '-',
      'Period': '.', 'Slash': '/', 'Backquote': '`',
      'BracketLeft': '[', 'BracketRight': ']', 'Backslash': '\\', 'Quote': "'"
    };

    const pressedModifiers = new Set();
    function getModifiers() {
      const mods = [];
      if (pressedModifiers.has('control')) mods.push('control');
      if (pressedModifiers.has('alt')) mods.push('alt');
      if (pressedModifiers.has('shift')) mods.push('shift');
      if (pressedModifiers.has('command')) mods.push('command');
      return mods;
    }

    let lastKeydownTime = 0;
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.altKey || e.metaKey) e.preventDefault();
      const code = e.code;
      const key = keyMap[code];
      if (!key) return;

      if (['control', 'alt', 'shift', 'command'].includes(key)) {
        if (!e.repeat) {
          pressedModifiers.add(key);
          sendCmd('key-down', { key });
        }
        return;
      }

      if (e.repeat && Date.now() - lastKeydownTime < 40) return;
      lastKeydownTime = Date.now();

      const mods = getModifiers();
      sendCmd('key-tap', { key, modifiers: mods });
    });

    document.addEventListener('keyup', (e) => {
      const key = keyMap[e.code];
      if (!key) return;
      if (['control', 'alt', 'shift', 'command'].includes(key)) {
        pressedModifiers.delete(key);
        sendCmd('key-up', { key });
      }
    });

    // ====== 工具栏按钮 ======
    $('btnFullscreen').onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
        $('btnFullscreen').classList.add('active');
      } else {
        document.exitFullscreen();
        $('btnFullscreen').classList.remove('active');
      }
    };

    $('btnClipboard').onclick = () => {
      $('clipboardModal').classList.toggle('show');
      if ($('clipboardModal').classList.contains('show')) $('clipTextarea').focus();
    };
    $('clipClose').onclick = $('clipCancel').onclick = () => {
      $('clipboardModal').classList.remove('show');
    };
    $('clipSend').onclick = async () => {
      await api.syncClipboard($('clipTextarea').value);
      $('clipboardModal').classList.remove('show');
    };

    $('btnSendKeys').onclick = () => {
      const choice = prompt('请输入组合键（如 Ctrl+Alt+Del、Win+D、Alt+F4）：', 'Ctrl+Alt+Del');
      if (!choice) return;
      const parts = choice.split(/[+＋]/).map(s => s.trim().toLowerCase());
      const mods = [];
      let mainKey = null;
      for (const p of parts) {
        if (p === 'ctrl' || p === 'control') mods.push('control');
        else if (p === 'alt') mods.push('alt');
        else if (p === 'shift') mods.push('shift');
        else if (p === 'win' || p === 'windows' || p === 'cmd' || p === 'command') mods.push('command');
        else mainKey = p;
      }
      if (!mainKey) { alert('需要指定一个主键'); return; }
      if (mainKey === 'del' || mainKey === 'delete') mainKey = 'delete';
      sendCmd('key-tap', { key: mainKey, modifiers: mods });
    };

    $('btnDisconnect').onclick = async () => {
      if (confirm('确定要断开连接吗？')) {
        await api.disconnect();
        window.close();
      }
    };

    $('btnCloseWindow').onclick = () => window.close();

    // ====== 会话结束 ======
    api.onSessionEnded(() => {
      $('overlayEnd').classList.add('show');
    });
  </script>
</body>
</html>

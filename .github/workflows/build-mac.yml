name: Build Mac DMG

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-14
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
      GH_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: false
      ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
      ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Show environment
        run: |
          node --version
          npm --version
          echo "Architecture: $(uname -m)"
          echo "Working directory: $(pwd)"
          ls -la

      - name: Install dependencies
        run: npm install

      - name: Show installed packages
        run: |
          echo "=== Package.json ==="
          cat package.json
          echo "=== Node modules ==="
          ls node_modules/ | head -20

      - name: Clean dist
        run: rm -rf dist dist-* 2>/dev/null; echo "Cleaned"

      - name: Build DMG (arm64 + x64)
        run: npx electron-builder --mac --publish never 2>&1 | tee build.log

      - name: Show build result
        run: |
          echo "=== Build output ==="
          ls -la dist/ 2>/dev/null || echo "No dist directory"
          echo "=== Build log ==="
          cat build.log 2>/dev/null || echo "No build log"

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RemoteControl-Mac-DMG
          path: |
            dist/*.dmg
            dist/*.blockmap
          retention-days: 30
          if-no-files-found: error

name: Build Mac DMG

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  # Apple Silicon (M1/M2/M3) - macos-14 容量充足，优先构建
  build-mac-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --ignore-engines --network-timeout 300000

      - name: Build arm64 DMG
        run: npx electron-builder --mac arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Upload arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteControl-Mac-arm64
          path: |
            dist/*arm64*.dmg
            dist/*arm64*.blockmap
          retention-days: 30

  # Intel Mac - macos-13 可能排队，单独跑
  build-mac-x64:
    runs-on: macos-13
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --ignore-engines --network-timeout 300000

      - name: Build x64 DMG
        run: npx electron-builder --mac x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteControl-Mac-x64
          path: |
            dist/*x64*.dmg
            dist/*x64*.blockmap
          retention-days: 30

  # 合并 Release（仅 tag 触发时）
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build-mac-arm64, build-mac-x64]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List downloaded files
        run: find . -name "*.dmg" -o -name "*.blockmap" | head -20

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RemoteControl-Mac-arm64/*.dmg
            RemoteControl-Mac-x64/*.dmg
          draft: true
          name: ${{ github.ref_name }}
          generate_release_notes: true

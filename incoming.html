<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>连接请求</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: #fff;
      padding: 24px;
      color: #333;
    }
    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }
    .avatar {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 22px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .request-info { flex: 1; }
    .req-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .req-desc {
      font-size: 13px;
      color: #888;
    }
    .req-desc .highlight {
      color: #667eea;
      font-weight: 600;
      font-family: 'Courier New', monospace;
    }

    .warn-box {
      background: #fff8e1;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      color: #e65100;
      margin-bottom: 20px;
      line-height: 1.5;
      display: flex;
      gap: 8px;
    }
    .warn-box svg {
      width: 16px; height: 16px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: auto;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-reject {
      background: #f5f5f5;
      color: #666;
    }
    .btn-reject:hover { background: #ebebeb; }
    .btn-accept {
      background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
      color: #fff;
    }
    .btn-accept:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="avatar" id="avatar">?</div>
      <div class="request-info">
        <div class="req-title" id="nameText">有用户请求连接</div>
        <div class="req-desc">
          设备代码: <span class="highlight" id="idText">------</span>
        </div>
      </div>
    </div>

    <div class="warn-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      接受后，对方可以看到您的屏幕并控制您的鼠标键盘。请确认您认识对方。
    </div>

    <div class="actions">
      <button class="btn btn-reject" id="btnReject">拒绝</button>
      <button class="btn btn-accept" id="btnAccept">允许连接</button>
    </div>
  </div>

  <script>
    const api = window.remoteAPI;
    const $ = id => document.getElementById(id);

    const params = new URLSearchParams(location.search);
    const controllerId = params.get('controllerId') || '------';
    const controllerName = params.get('controllerName') || '对方';
    const sessionId = params.get('sessionId');

    $('nameText').textContent = controllerName + ' 请求连接';
    $('idText').textContent = controllerId.slice(0,3)+' '+controllerId.slice(3,6)+' '+controllerId.slice(6);
    $('avatar').textContent = (controllerName.charAt(0) || '?').toUpperCase();

    $('btnAccept').onclick = async () => {
      await api.connectAccept(sessionId);
      window.close();
    };
    $('btnReject').onclick = async () => {
      await api.connectReject(sessionId, '对方拒绝了您的连接');
      window.close();
    };

    // 30秒后自动关闭（如果对方没操作）
    setTimeout(() => {
      api.connectReject(sessionId, '请求超时');
      window.close();
    }, 30000);
  </script>
</body>
</html>
